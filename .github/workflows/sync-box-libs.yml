          ok=0; fail=0
          for f in $FILES; do
            mkdir -p "$(dirname "$f")"
            if curl -fsSL "$BASE/$f" -o "$f"; then
              ok=$((ok+1))
            else
              echo "FAIL: $f"
              fail=$((fail+1))
            fi
          done
          echo "downloaded=$ok failed=$fail"
          cd "${{ github.workspace }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/libs
          if ! git diff --cached --quiet; then
            git commit -m "sync libs from liu673cn/box"
            git push
            echo "pushed=yes"
          else
            echo "pushed=no(no-change)"
          fi
